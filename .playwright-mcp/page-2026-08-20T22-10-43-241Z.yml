                - textbox "Title" [ref=f1e50]: Moving money between your own accounts
              - generic [ref=f1e51]:
                - generic [ref=f1e52]: The requirement
                - textbox "The requirement" [ref=f1e53]: "A customer may transfer money between any two of their own deposit accounts (checking and savings). Happy path: The customer selects a source account, a target account, and an amount greater than $0.00 and at most $10,000, reviews the transfer on a confirmation screen, and confirms. The transfer completes within 2 seconds; both balances update together and the transfer appears in the history of both accounts. Transfers are free and in the account's currency. Insufficient funds: A transfer is rejected when the amount exceeds the source account's available balance (current balance minus pending holds). A transfer equal to the available balance is allowed; one cent above it is rejected. On rejection, no money moves — the source is not debited, the target is not credited — and the customer sees an INSUFFICIENT_FUNDS error. Validation: Amounts of $0.00 or less, negative amounts, and amounts above the limit are rejected with a validation error. Transfers to or from a credit card account are out of scope."
                - paragraph [ref=f1e54]: Rewrite it until someone could tell you whether the system passes or fails.
