name: Playwright Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run ZincBank smoke tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: npm test -- --tags "@zincbank and @smoke"

      - name: Upload ZincBank report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zincbank-report
          path: reports/

  zinctm-smoke:
    name: ZincTM Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run ZincTM smoke tests
        env:
          ZINCTM_BASE_URL: ${{ secrets.ZINCTM_BASE_URL }}
          ZINCTM_USERNAME: ${{ secrets.ZINCTM_USERNAME }}
          ZINCTM_PASSWORD: ${{ secrets.ZINCTM_PASSWORD }}
        run: npm test -- --tags "@zinctm and @smoke"

      - name: Upload ZincTM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zinctm-report
          path: reports/
