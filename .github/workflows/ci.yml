# Simple CI: install dependencies, then type-check.
# No browser tests, no secrets, and no live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Install and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # package.json "typecheck" runs `tsc --noEmit`.
      - name: Type-check
        run: npm run typecheck
